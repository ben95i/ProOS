<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1260 910" width="1260" height="910" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">
  <title>SmartThermo relay circuit</title>
  <defs>
    <!-- ground symbol, origin at the connection point -->
    <g id="gnd" stroke="#222" stroke-width="2">
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="-9" y1="6" x2="9" y2="6"/>
      <line x1="-4" y1="12" x2="4" y2="12"/>
    </g>
    <!-- normally-open contact, left terminal at the origin -->
    <g id="sw-no" stroke="currentColor" stroke-width="2.5" fill="#fff">
      <line x1="0" y1="0" x2="40" y2="-14"/>
      <circle cx="0" cy="0" r="3.5"/>
      <circle cx="44" cy="0" r="3.5"/>
    </g>
    <!-- normally-closed contact, left terminal at the origin -->
    <g id="sw-nc" stroke="currentColor" stroke-width="2.5" fill="#fff">
      <line x1="44" y1="0" x2="44" y2="8"/>
      <line x1="0" y1="0" x2="48" y2="8"/>
      <circle cx="0" cy="0" r="3.5"/>
      <circle cx="44" cy="0" r="3.5"/>
    </g>
    <!-- one coil driver; origin = transistor column at the +5 V rail -->
    <g id="driver" stroke="#222" stroke-width="2" fill="none">
      <!-- +5 V rail -->
      <line x1="-20" y1="0" x2="70" y2="0"/>
      <!-- coil -->
      <line x1="0" y1="0" x2="0" y2="30"/>
      <rect x="-18" y="30" width="36" height="50" stroke="currentColor" stroke-width="2.5" fill="#fff"/>
      <line x1="-18" y1="30" x2="18" y2="80" stroke="currentColor" stroke-width="1.5"/>
      <line x1="0" y1="80" x2="0" y2="120"/>
      <!-- flyback diode, cathode to +5 V -->
      <line x1="70" y1="0" x2="70" y2="40"/>
      <line x1="58" y1="40" x2="82" y2="40"/>
      <polygon points="58,62 82,62 70,40" fill="#222"/>
      <line x1="70" y1="62" x2="70" y2="120"/>
      <line x1="0" y1="120" x2="70" y2="120"/>
      <circle cx="0" cy="120" r="3.5" fill="#222" stroke="none"/>
      <!-- NPN transistor -->
      <circle cx="-8" cy="170" r="27"/>
      <line x1="0" y1="120" x2="0" y2="145"/>
      <line x1="0" y1="145" x2="-20" y2="160"/>
      <line x1="-20" y1="150" x2="-20" y2="190" stroke-width="3"/>
      <line x1="-20" y1="180" x2="0" y2="195"/>
      <polygon points="0,195 -9.6,192.8 -4.8,186.4" fill="#222"/>
      <line x1="0" y1="195" x2="0" y2="240"/>
      <!-- base resistor and pull-down -->
      <line x1="-210" y1="170" x2="-150" y2="170"/>
      <rect x="-150" y="162" width="50" height="16" fill="#fff"/>
      <line x1="-100" y1="170" x2="-20" y2="170"/>
      <circle cx="-60" cy="170" r="3.5" fill="#222" stroke="none"/>
      <line x1="-60" y1="170" x2="-60" y2="195"/>
      <rect x="-68" y="195" width="16" height="40" fill="#fff"/>
      <line x1="-60" y1="235" x2="-60" y2="240"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1260" height="910" fill="#fff"/>

  <text x="30" y="40" font-size="22" font-weight="bold">SmartThermo relay circuit</text>
  <text x="30" y="62" font-size="13" fill="#555">Pico W driving three TE V23079 (P2) DPDT relays, 5 V coils, with a hardware interlock on the spare poles</text>

  <!-- ===================== Power and Pico ===================== -->
  <text x="30" y="100" font-size="15" font-weight="bold">Power and Pico</text>

  <!-- wall plate -->
  <rect x="40" y="130" width="70" height="150" fill="none" stroke="#222" stroke-width="2"/>
  <text x="75" y="298" text-anchor="middle" font-size="12" fill="#555">Wall plate</text>
  <text x="60" y="175" font-weight="bold">R</text>
  <text x="60" y="245" font-weight="bold">C</text>

  <g stroke="#222" stroke-width="2" fill="none">
    <!-- R and C into the AC-DC module; R also to the contact bus -->
    <line x1="110" y1="170" x2="170" y2="170"/>
    <line x1="110" y1="240" x2="170" y2="240"/>
    <line x1="140" y1="170" x2="140" y2="140"/>
    <!-- module outputs -->
    <line x1="290" y1="175" x2="345" y2="175"/>
    <line x1="330" y1="175" x2="330" y2="140"/>
    <line x1="360" y1="175" x2="400" y2="175"/>
    <line x1="290" y1="235" x2="400" y2="235"/>
    <line x1="330" y1="235" x2="330" y2="255"/>
    <!-- DHT22 wiring -->
    <line x1="400" y1="290" x2="255" y2="290"/>
    <line x1="255" y1="290" x2="255" y2="330"/>
    <line x1="350" y1="290" x2="350" y2="300"/>
    <line x1="350" y1="330" x2="350" y2="355"/>
    <line x1="310" y1="355" x2="400" y2="355"/>
    <line x1="255" y1="400" x2="255" y2="408"/>
    <!-- GPIO stubs -->
    <line x1="570" y1="230" x2="595" y2="230"/>
    <line x1="570" y1="280" x2="595" y2="280"/>
    <line x1="570" y1="330" x2="595" y2="330"/>
  </g>
  <circle cx="110" cy="170" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="110" cy="240" r="5" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="140" cy="170" r="3.5"/>
  <circle cx="330" cy="175" r="3.5"/>
  <circle cx="330" cy="235" r="3.5"/>
  <circle cx="350" cy="290" r="3.5"/>
  <circle cx="350" cy="355" r="3.5"/>
  <text x="140" y="132" text-anchor="middle" font-size="12" font-weight="bold">R bus →</text>
  <text x="330" y="132" text-anchor="middle" font-size="12" font-weight="bold">+5 V to coils</text>

  <!-- AC-DC module -->
  <rect x="170" y="150" width="120" height="110" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="230" y="185" text-anchor="middle" font-weight="bold">AC-DC module</text>
  <text x="230" y="204" text-anchor="middle" font-size="12">24 VAC in</text>
  <text x="230" y="220" text-anchor="middle" font-size="12">5 VDC out, ≥ 0.5 A</text>
  <text x="180" y="174" font-size="11" fill="#555">~</text>
  <text x="180" y="244" font-size="11" fill="#555">~</text>
  <text x="284" y="172" text-anchor="end" font-size="11" fill="#555">+5 V</text>
  <text x="284" y="250" text-anchor="end" font-size="11" fill="#555">GND</text>
  <use href="#gnd" xlink:href="#gnd" x="330" y="255"/>

  <!-- D4 Schottky into VSYS -->
  <polygon points="345,167 345,183 360,175" fill="#222"/>
  <line x1="360" y1="167" x2="360" y2="183" stroke="#222" stroke-width="2"/>
  <text x="366" y="160" text-anchor="middle" font-size="11">D4 SS14</text>

  <!-- Pico W -->
  <rect x="400" y="140" width="170" height="270" fill="#eef5ee" stroke="#222" stroke-width="2"/>
  <text x="485" y="158" text-anchor="middle" font-weight="bold" font-size="12">Raspberry Pi Pico W</text>
  <text x="408" y="179" font-size="12">VSYS (39)</text>
  <text x="408" y="239" font-size="12">GND (38)</text>
  <text x="408" y="294" font-size="12">3V3 (36)</text>
  <text x="408" y="359" font-size="12">GP22 (29)</text>
  <text x="562" y="234" text-anchor="end" font-size="12">GP16 (21)</text>
  <text x="562" y="284" text-anchor="end" font-size="12">GP17 (22)</text>
  <text x="562" y="334" text-anchor="end" font-size="12">GP18 (24)</text>
  <text x="600" y="234" font-size="11" fill="#2e7d32">Q3</text>
  <text x="600" y="284" font-size="11" fill="#1565c0">Q2</text>
  <text x="600" y="334" font-size="11" fill="#c25e00">Q1</text>

  <!-- DHT22 -->
  <rect x="200" y="330" width="110" height="70" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="255" y="360" text-anchor="middle" font-weight="bold">DHT22</text>
  <text x="208" y="346" font-size="10" fill="#555">VCC</text>
  <text x="302" y="368" text-anchor="end" font-size="10" fill="#555">DATA</text>
  <text x="255" y="394" text-anchor="middle" font-size="10" fill="#555">GND</text>
  <rect x="342" y="300" width="16" height="30" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="364" y="320" font-size="11">10 kΩ</text>
  <use href="#gnd" xlink:href="#gnd" x="255" y="408"/>

  <!-- ===================== Contacts ===================== -->
  <line x1="630" y1="85" x2="630" y2="430" stroke="#ccc" stroke-width="1"/>
  <text x="650" y="100" font-size="15" font-weight="bold">Relay contacts and interlocks</text>
  <text x="680" y="143" text-anchor="middle" font-weight="bold">R</text>

  <g stroke="#222" stroke-width="2" fill="none">
    <!-- R bus -->
    <line x1="680" y1="150" x2="680" y2="350"/>
    <!-- G row -->
    <line x1="680" y1="170" x2="960" y2="170"/>
    <line x1="1004" y1="170" x2="1150" y2="170"/>
    <!-- Y1 row -->
    <line x1="680" y1="260" x2="720" y2="260"/>
    <line x1="764" y1="260" x2="840" y2="260"/>
    <line x1="884" y1="260" x2="960" y2="260"/>
    <line x1="1004" y1="260" x2="1150" y2="260"/>
    <!-- W1 row -->
    <line x1="680" y1="350" x2="840" y2="350"/>
    <line x1="884" y1="350" x2="960" y2="350"/>
    <line x1="1004" y1="350" x2="1150" y2="350"/>
  </g>
  <circle cx="680" cy="170" r="3.5"/>
  <circle cx="680" cy="260" r="3.5"/>

  <text x="782" y="135" text-anchor="middle" font-size="11" fill="#555">interlock poles (b)</text>
  <text x="982" y="135" text-anchor="middle" font-size="11" fill="#555">main poles (a)</text>

  <!-- G row: K3a NO -->
  <use href="#sw-no" xlink:href="#sw-no" x="960" y="170" color="#2e7d32"/>
  <text x="982" y="196" text-anchor="middle" font-size="12" fill="#2e7d32">K3a NO</text>
  <!-- Y1 row: K3b NO, K1b NC, K2a NO -->
  <use href="#sw-no" xlink:href="#sw-no" x="720" y="260" color="#2e7d32"/>
  <text x="742" y="290" text-anchor="middle" font-size="12" fill="#2e7d32">K3b NO</text>
  <use href="#sw-nc" xlink:href="#sw-nc" x="840" y="260" color="#c25e00"/>
  <text x="862" y="290" text-anchor="middle" font-size="12" fill="#c25e00">K1b NC</text>
  <use href="#sw-no" xlink:href="#sw-no" x="960" y="260" color="#1565c0"/>
  <text x="982" y="290" text-anchor="middle" font-size="12" fill="#1565c0">K2a NO</text>
  <!-- W1 row: K2b NC, K1a NO -->
  <use href="#sw-nc" xlink:href="#sw-nc" x="840" y="350" color="#1565c0"/>
  <text x="862" y="380" text-anchor="middle" font-size="12" fill="#1565c0">K2b NC</text>
  <use href="#sw-no" xlink:href="#sw-no" x="960" y="350" color="#c25e00"/>
  <text x="982" y="380" text-anchor="middle" font-size="12" fill="#c25e00">K1a NO</text>

  <!-- furnace terminals -->
  <rect x="1135" y="145" width="110" height="235" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1190" y="398" text-anchor="middle" font-size="11" fill="#555">to furnace</text>
  <circle cx="1150" cy="170" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="1150" cy="260" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="1150" cy="350" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="1164" y="175" font-weight="bold">G</text>
  <text x="1164" y="191" font-size="11" fill="#555">blower</text>
  <text x="1164" y="265" font-weight="bold">Y1</text>
  <text x="1164" y="281" font-size="11" fill="#555">compressor</text>
  <text x="1164" y="355" font-weight="bold">W1</text>
  <text x="1164" y="371" font-size="11" fill="#555">heat</text>

  <text x="650" y="410" font-size="12">Y1 gets R only while K3 (G) is closed and K1 (W1) is open.</text>
  <text x="650" y="427" font-size="12">W1 gets R only while K2 (Y1) is open. C is never switched.</text>

  <!-- ===================== Coil drivers ===================== -->
  <line x1="20" y1="450" x2="1240" y2="450" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="480" font-size="15" font-weight="bold">Coil drivers, one per relay</text>

  <!-- K1 / W1 heat -->
  <use href="#driver" xlink:href="#driver" x="260" y="520" color="#c25e00"/>
  <use href="#gnd" xlink:href="#gnd" x="260" y="760"/>
  <use href="#gnd" xlink:href="#gnd" x="200" y="760"/>
  <text x="235" y="524" text-anchor="end" font-size="12" font-weight="bold">+5 V</text>
  <text x="55" y="680" font-size="12">GP18 · pin 24</text>
  <text x="135" y="713" text-anchor="middle" font-size="11">1 kΩ</text>
  <text x="186" y="740" text-anchor="end" font-size="11">10 kΩ</text>
  <text x="236" y="572" text-anchor="end" font-weight="bold" fill="#c25e00">K1 coil</text>
  <text x="236" y="588" text-anchor="end" font-size="11" fill="#555">W1 heat</text>
  <text x="348" y="575" font-size="12">D1</text>
  <text x="348" y="591" font-size="11" fill="#555">1N4148</text>
  <text x="284" y="698" font-size="12">Q1</text>
  <text x="284" y="714" font-size="11" fill="#555">2N5551</text>

  <!-- K2 / Y1 cool -->
  <use href="#driver" xlink:href="#driver" x="660" y="520" color="#1565c0"/>
  <use href="#gnd" xlink:href="#gnd" x="660" y="760"/>
  <use href="#gnd" xlink:href="#gnd" x="600" y="760"/>
  <text x="635" y="524" text-anchor="end" font-size="12" font-weight="bold">+5 V</text>
  <text x="455" y="680" font-size="12">GP17 · pin 22</text>
  <text x="535" y="713" text-anchor="middle" font-size="11">1 kΩ</text>
  <text x="586" y="740" text-anchor="end" font-size="11">10 kΩ</text>
  <text x="636" y="572" text-anchor="end" font-weight="bold" fill="#1565c0">K2 coil</text>
  <text x="636" y="588" text-anchor="end" font-size="11" fill="#555">Y1 cool</text>
  <text x="748" y="575" font-size="12">D2</text>
  <text x="748" y="591" font-size="11" fill="#555">1N4148</text>
  <text x="684" y="698" font-size="12">Q2</text>
  <text x="684" y="714" font-size="11" fill="#555">2N5551</text>

  <!-- K3 / G fan -->
  <use href="#driver" xlink:href="#driver" x="1060" y="520" color="#2e7d32"/>
  <use href="#gnd" xlink:href="#gnd" x="1060" y="760"/>
  <use href="#gnd" xlink:href="#gnd" x="1000" y="760"/>
  <text x="1035" y="524" text-anchor="end" font-size="12" font-weight="bold">+5 V</text>
  <text x="855" y="680" font-size="12">GP16 · pin 21</text>
  <text x="935" y="713" text-anchor="middle" font-size="11">1 kΩ</text>
  <text x="986" y="740" text-anchor="end" font-size="11">10 kΩ</text>
  <text x="1036" y="572" text-anchor="end" font-weight="bold" fill="#2e7d32">K3 coil</text>
  <text x="1036" y="588" text-anchor="end" font-size="11" fill="#555">G fan</text>
  <text x="1148" y="575" font-size="12">D3</text>
  <text x="1148" y="591" font-size="11" fill="#555">1N4148</text>
  <text x="1084" y="698" font-size="12">Q3</text>
  <text x="1084" y="714" font-size="11" fill="#555">2N5551</text>

  <!-- ===================== Notes ===================== -->
  <line x1="20" y1="800" x2="1240" y2="800" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="825" font-size="12">K1–K3: TE V23079 (P2) DPDT, 5 VDC coil about 28 mA, contacts 2 A / 250 VAC. Pole a switches the output; pole b is the interlock.</text>
  <text x="30" y="845" font-size="12">Pins are inputs with pull-down from reset, plus the 10 kΩ pull-downs, so every relay stays open through power-up, reset and firmware upload.</text>
  <text x="30" y="865" font-size="12">D4 lets USB and the 5 V module both power the Pico. The relay contacts are the only link between the Pico side and W1, Y1 and G.</text>
  <text x="30" y="885" font-size="12">Turn off the furnace power before wiring. Never connect R to C, or C to any output.</text>
</svg>
