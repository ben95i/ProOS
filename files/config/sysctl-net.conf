## Network settings, installed as /etc/sysctl.d/90-net.conf and applied at boot by
## systemd-sysctl. Only net.* settings can be changed inside an LXC (the rest of
## /proc/sys is read-only there), so keep anything else out of this file.

## Disable IPv6
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1
