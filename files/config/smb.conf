[global]
# Interfaces
	dns proxy = no
    interfaces = 127.0.0.1/24, 192.168.1.0/24, 192.168.2.0/24, 192.168.122.0/24
    bind interfaces only = yes
# General
	server role = standalone server
    server min protocol = SMB2
    client min protocol = SMB2
	server string = Files
    netbios name = FILES
	workgroup = WORKGROUP
# Logging
    max log size = 32000
    log level = 2
# Active Directory (Master)
    local master = yes
    preferred master = yes
	domain master = yes
	os level = 255
    wins support = yes
# Security
	security = USER
	ea support = yes
    nt acl support = yes
	acl allow execute always = yes
    store dos attributes = yes
	obey pam restrictions = yes
	pam password change = yes
	unix password sync = yes
# Permissions
	invalid users = root
	force group = shared
	guest ok = no
	map to guest = Bad User
# Miscellaneous
	unix extensions = no
	case sensitive = yes
# Hidden Files
    hide dot files = yes
    hide special files = yes
    hide files = /._*/$*/.DS_Store/AUTORUN.INF/Desktop.ini/desktop.ini/
    veto files = /Thumbs.db/thumbs.db/TheVolumeSettingsFolder/Network Trash Folder/
    delete veto files = yes

# Shares #

[Data]
	force user = ben
	path = /mnt/data
	valid users = ben media
	read list = ben media
	write list = ben

[Media]
	force user = ben
	path = /mnt/media
	valid users = ben media
	read list = ben media
	write list = ben

[Scratch]
    force user = ben
	path = /mnt/scratch/share
	valid users = ben media
	read list = ben media
	write list = ben media

[Cameras]
    force user = ben
	path = /mnt/scratch/cameras
	valid users = ben media
	read list = ben media
	write list = ben media

[Games]
    force user = ben
	path = /mnt/.regions/Games
	valid users = ben media
	read list = ben media
	write list = ben media

[MP3s]
    force user = ben
	path = /mnt/scratch/mp3_music
	valid users = ben media
	read list = ben media
	write list = ben media

[Regions]
	browseable = no
    force user = ben
	path = /mnt/regmnts
    valid users = ben
	write list = ben
	follow symlinks = yes
	wide links = yes
