arch: amd64
cores: 8
features: nesting=1
hostname: files
memory: 8192
mp0: /mnt/datastore/data,mp=/mnt/data,replicate=0
mp1: /mnt/datastore/media,mp=/mnt/media,replicate=0
mp2: /mnt/datastore/.regions,mp=/mnt/.regions,replicate=0
mp3: /mnt/pve/scratch/files,mp=/mnt/scratch,replicate=0
mp4: /mnt/bindmnts,mp=/mnt/regmnts,replicate=0
mp5: /mnt/extbkps,mp=/mnt/external,replicate=0,ro=1
net0: name=eth0,bridge=vmbr0,gw=192.168.1.1,hwaddr=FE:C1:70:9C:0D:14,ip=192.168.1.4/24,ip6=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-zfs:subvol-101-disk-0,size=32G
startup: order=2
swap: 2048
unprivileged: 1
lxc.idmap: u 0 100000 1000
lxc.idmap: u 1000 1000 1
lxc.idmap: u 1001 101001 64535
lxc.idmap: g 0 100000 1000
lxc.idmap: g 1000 1000 1
lxc.idmap: g 1001 101001 64535
