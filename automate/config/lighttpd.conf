server.modules = (
        "mod_setenv",
        "mod_access",
        "mod_proxy",
        "mod_openssl",
        "mod_status",
        "mod_deflate"
)

server.document-root = "/var/www/html"
server.pid-file = "/var/www/lighttpd.pid"
# Scratch space for request bodies lighttpd has to buffer. Separate from the
# upload API's own folder (/mnt/upload), so lighttpd's lighttpd-upload-* temp
# files never land among the finished photos.
server.upload-dirs = ( "/var/www/uploads" )
server.username = "www-data"
server.groupname = "www-data"
server.port = 80
server.max-connections = 128
server.stream-response-body = 2
# Hands the request body to the backend as it arrives instead of buffering
# the whole thing to disk first. Without this every 1MB chunk is written to
# server.upload-dirs and read back before node ever sees it.
server.stream-request-body = 2

# A request body larger than this is refused, in kilobytes. The upload route
# raises it below; everything else on the site posts a few KB at most.
server.max-request-size = 512

# Seconds a transfer may stall before the connection is dropped. A phone on
# weak wifi part way through a 1MB chunk needs more than the default 60.
server.max-read-idle = 120
server.max-write-idle = 240

deflate.mimetypes = ("text/html", "text/plain", "text/css", "text/javascript", "text/xml")
deflate.allowed-encodings = ( "br", "gzip", "deflate" )

$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/ssl_cert.pem"
    ssl.ca-file = "/etc/lighttpd/root_ca.crt"   
}

index-file.names = ( "index.html" )
url.access-deny = ( "~", ".inc" )
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

include_shell "/usr/share/lighttpd/use-ipv6.pl " + server.port
include_shell "/usr/share/lighttpd/create-mime.conf.pl"
include "/etc/lighttpd/conf-enabled/*.conf"

# CORS Headers
setenv.add-response-header = (
        "Access-Control-Allow-Origin" => "*",
        "Access-Control-Allow-Credentials" => "true",
        "Access-Control-Allow-Methods" => "GET,HEAD,OPTIONS,POST,PUT",
        "Access-Control-Allow-Headers" => "x-transmission-session-id, Access-Control-Allow-Headers, Origin ,Accept, X-Requested-With, Content-Type, Access-Control-Request-Method, Access-Control-Request-Headers"
)

## Upload Reverse Proxy
# Matched before the general /api rule below, since lighttpd takes the first
# block whose condition matches. 2048 KB leaves the 1MB chunk room for its
# headers without accepting a whole video in one request.
$HTTP["url"] =~ "^/api/upload" {
  server.max-request-size = 2048
  proxy.server = ("" => (( "host" => "127.0.0.1", "port" => "3000" )))
}

## API Reverse Proxy
$HTTP["url"] =~ "^/api" {
  proxy.server = ("" => (( "host" => "127.0.0.1", "port" => "3000" )))
}
