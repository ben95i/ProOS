<!DOCTYPE html>
<html lang="en-US" class="notranslate" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=0.75, minimum-scale=0.75, maximum-scale=0.75, shrink-to-fit=no"/>
  <title id="title">Automate</title>
  <link href="img/automate.png" rel="icon" type="image/x-icon">
  <link href="fonts/fa/css/all.min.css" rel="stylesheet" type="text/css">
  <!-- One sheet per component, cut out of the old single styles.css.
       ORDER MATTERS: main.css holds the globals (palette, .button, .dd-content,
       the shared spinners) and must stay first, because several component
       rules override one of its rules at equal specificity and only win by
       coming later. menus.css (the dropdown menus), the three room sheets
       and server.css (the Server window) were cut out of main.css in turn
       and stay directly after it, in this order, so their rules meet every
       other sheet's as they did before.
       lists.css stays last of the two list-style sheets: it carries the drag
       handle rules the bookmarks menu also uses. -->
  <link href="styles/main.css" rel="stylesheet" type="text/css">
  <link href="styles/menus.css" rel="stylesheet" type="text/css">
  <link href="styles/livingrm.css" rel="stylesheet" type="text/css">
  <link href="styles/bedrm.css" rel="stylesheet" type="text/css">
  <link href="styles/bathrm.css" rel="stylesheet" type="text/css">
  <link href="styles/server.css" rel="stylesheet" type="text/css">
  <link href="styles/groups.css" rel="stylesheet" type="text/css">
  <link href="styles/stars.css" rel="stylesheet" type="text/css">
  <link href="styles/roomstate.css" rel="stylesheet" type="text/css">
  <link href="styles/weather.css" rel="stylesheet" type="text/css">
  <link href="styles/switch.css" rel="stylesheet" type="text/css">
  <link href="styles/upload.css" rel="stylesheet" type="text/css">
  <link href="styles/camera.css" rel="stylesheet" type="text/css">
  <link href="styles/colorprompt.css" rel="stylesheet" type="text/css">
  <link href="styles/bookmarks.css" rel="stylesheet" type="text/css">
  <link href="styles/lists.css" rel="stylesheet" type="text/css">
  <!-- main.js imports every other module itself (the rooms, menus.js,
       utils.js and the rest), so they need no tags of their own -->
  <script type="module" src="main.js"></script>
</head>
<body class="scroll-bar-style" ontouchstart="">
<!-- All page markup is generated per device model by the template literals
     in main.js (buildPageHTML/renderPage) and injected on DOMContentLoaded.
     Markup for the other device models is never present in the DOM, and
     removeInjectedPage() cleans it all up before any re-render. -->
</body>
</html>
