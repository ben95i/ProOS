;
; Netatalk 4.x configuration file
;

[Global]
  server name = AFP
  hosts allow = 192.168.1.0/24
  legacy icon = globe
  zeroconf = yes
  appletalk = yes
  uam list = uams_clrtxt.so,uams_dhx.so 
  mimic model = PowerMac4,4
  vol dbpath = /opt/afpdb
  log file = /opt/afp.log
  vol preset = Defaults

[Defaults]
  unix priv = yes
  invisible dots = yes
  valid users = ben
  legacy volume size = yes
  appledouble = v2
  ea = ad

[Homes]
  basedir regex = /home/ben
  home name = "Home Directory"

[Scratch]
  path = /mnt/smb/Scratch
  read only = no

[MP3s]
  path = /mnt/smb/MP3s
  read only = no

[Media]
  path = /mnt/smb/Media
  read only = yes

[Data]
  path = /mnt/smb/Data
  read only = yes
