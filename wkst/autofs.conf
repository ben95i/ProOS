# /etc/autofs.conf: autofs daemon settings (see autofs.conf(5))
[ autofs ]
# Default idle time in seconds before a mount is unmounted
timeout = 600
# Seconds a failed mount is remembered before the next access tries again,
# so a share comes back within this long after the server does
negative_timeout = 10
# Seconds to wait for a mount or unmount command before killing it,
# so a hung mount attempt cannot block the mount point
mount_wait = 15
umount_wait = 12
browse_mode = no
logging = none
