server.modules = (
    "mod_setenv",
    "mod_expire",
    "mod_access",
    "mod_proxy",
    "mod_openssl",
    "mod_redirect",
    "mod_status",
    "mod_deflate"
)

server.document-root        = "/var/www/html"
server.upload-dirs          = ( "/var/www/uploads" )
server.errorlog             = "/dev/null"
server.pid-file             = "/var/www/lighttpd.pid"
server.username             = "www-data"
server.groupname            = "www-data"
server.port                 = 80
server.max-connections      = 128
server.stream-response-body = 2

index-file.names = ( "index.html" )
url.access-deny = ( "~", ".inc" )
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

include_shell "/usr/share/lighttpd/use-ipv6.pl " + server.port
include_shell "/usr/share/lighttpd/create-mime.conf.pl"
include "/etc/lighttpd/conf-enabled/*.conf"

# CORS Headers
setenv.add-response-header = ( 
    "Access-Control-Allow-Origin" => "*", 
    "Access-Control-Allow-Headers" => "accept, origin, x-requested-with, content-type, x-transmission-session-id",
    "Access-Control-Expose-Headers" => "X-Transmission-Session-Id",
    "Access-Control-Allow-Methods" => "GET, POST, OPTIONS"
)

## --- CAPTIVE PORTAL REDIRECT LOGIC ---
## When a device asks for "http://captive.apple.com", dnsmasq sends it to 192.168.10.1:80
## The HTTP request still says 'Host: captive.apple.com'
## Triggers ONLY when the device explicitly requests one of the spoofed domains
$HTTP["host"] =~ "^(captive\.apple\.com|connectivitycheck\.gstatic\.com|clients3\.google\.com|generate_204|msftconnecttest\.com|ipv6\.msftconnecttest\.com)(:[0-9]+)?$" {
    url.redirect = (
        "^/(.*)" => "http://192.168.10.1/"
    )
    url.redirect-code = 302
}

## Browser cache
# The page, its scripts and its stylesheets go out with max-age=0, so a
# browser checks each with the server before using it (a 304 when it is
# unchanged) and never runs a freshly deployed module next to a stale one.
# Without it iOS Safari keeps .js files across reloads, and a module that
# imports something its stale neighbour does not export stops the whole page
# before anything is drawn. Images and fonts keep the browser's own caching.
$HTTP["url"] =~ "(^/$|\.(html|js|css)$)" {
    expire.url = ( "" => "access plus 0 seconds" )
}

## API Reverse Proxy
$HTTP["url"] =~ "^/api" {
    proxy.server = ("" => (( "host" => "127.0.0.1", "port" => "3000" )))
}

