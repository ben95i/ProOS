arch: amd64
cores: 4
features: nesting=1
hostname: media
memory: 8192
mp0: /mnt/datastore/media,mp=/mnt/media,replicate=0,ro=1
mp1: /mnt/pve/scratch/files/mp3_music,mp=/mnt/mp3_music,replicate=0
net0: name=eth0,bridge=vmbr0,firewall=0,gw=192.168.1.1,hwaddr=BC:24:11:3C:19:DC,ip=192.168.1.11/24,ip6=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-zfs:subvol-108-disk-0,size=64G
startup: order=2
swap: 2048
unprivileged: 1
## Allow 1000:1000 permissions to translate correctly
lxc.idmap = u 0 100000 1000
lxc.idmap = u 1000 1000 1
lxc.idmap = u 1001 101001 64535
lxc.idmap = g 0 100000 1000
lxc.idmap = g 1000 1000 1
lxc.idmap = g 1001 101001 64535