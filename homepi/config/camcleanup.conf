## /etc/camcleanup.conf - HomePi settings for camcleanup.sh
## Keeps the flash drive and Google Drive camera folders under their limits
## by deleting the oldest files first. One KEY=value per line, no quotes.
## Every setting is listed in /opt/rpi/camcleanup.sh.
## by Ben Provenzano III

## USB flash drive
FLASH_PATH=/media/usb0
FLASH_CAMERA_FOLDER=/media/usb0/cameras
FLASH_LIMIT_GB=52
FLASH_LOG_FILE=/media/usb0/cameras/camcleanup.log
FLASH_LOG_MAX_SIZE=5MB

## Google Drive (this Pi's own rclone mount, restarted when it hangs)
GDRIVE_PATH=/mnt/gsync
GDRIVE_CAMERA_FOLDER=/mnt/gsync/Cameras
GDRIVE_LIMIT_GB=14.5
RCLONE_SERVICE_NAME=rpi-rclone

## GB left free below each limit (and on each disk) after a cleanup
FREE_SPACE_RESERVE_GB=2.5

## Files modified within this many minutes are never deleted
MIN_FILE_AGE_MINUTES=10

## Seconds to wait for a mount check before treating the mount as hung
MOUNT_CHECK_TIMEOUT_SECONDS=60

## Seconds allowed for scanning a folder / reading free space
COMMAND_TIMEOUT_SECONDS=450

## Log used while the flash drive is not connected
FALLBACK_LOG_FILE=/tmp/camcleanup.log
FALLBACK_LOG_MAX_SIZE=128KB
