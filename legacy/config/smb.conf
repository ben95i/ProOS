[global]
# Interfaces
    dns proxy = no
    interfaces = 127.0.0.1/24, 192.168.1.0/24
    bind interfaces only = yes
# General
    server role = standalone server
    server min protocol = LANMAN1
    server max protocol = SMB2
    client min protocol = LANMAN1
    client max protocol = SMB2
    server string = Legacy
    netbios name = LEGACY
    workgroup = WORKGROUP
# Logging
    max log size = 32000
    log level = 2
# Active Directory (2nd Server on Network)
    local master = no
    preferred master = no
    domain master = no
    os level = 0
    wins support = no
    wins server = 192.168.1.4
# Security
    security = USER
    ntlm auth = yes
    lanman auth = yes
    client lanman auth = yes
    client plaintext auth = yes
    server signing = no
    store dos attributes = no
    obey pam restrictions = yes
    pam password change = yes
    unix password sync = yes
# Permissions
    invalid users = root
    valid users = ben
    force user = ben
    force group = shared
	guest ok = no
	map to guest = Bad User
# Miscellaneous
    case sensitive = no
    unix extensions = no
# Hidden Files
    hide dot files = yes
    hide special files = yes

# Shares #

[Scratch]
    path = /mnt/smb/Scratch
    write list = ben

[MP3s]
    path = /mnt/smb/MP3s
    write list = ben

[Media]
    read only = yes
    path = /mnt/smb/Media

[Data]
    read only = yes
    path = /mnt/smb/Data