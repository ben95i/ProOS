[global]
# Interfaces
    dns proxy = no
    interfaces = 192.168.1.0/24, 127.0.0.1/24
    bind interfaces only = yes
# General
    server role = standalone server
    server min protocol = LANMAN1
    server max protocol = SMB2
    client min protocol = LANMAN1
    client max protocol = SMB2
    server string = LegacySMB
    netbios name = LEGACYSMB
    workgroup = WORKGROUP
# Logging
    max log size = 8096
    log level = 2
    os level = 0
# Printers (Disabled)
    printing = bsd
    load printers = no
    printcap name = /dev/null
    disable spoolss = yes
# Active Directory
	domain master = no
    local master = no
    preferred master = no
    wins support = no
# Security
    security = USER
    ntlm auth = yes
    lanman auth = yes
    client lanman auth = yes
    client plaintext auth = yes
    server signing = no
    store dos attributes = no
    obey pam restrictions = yes
    pam password change = yes
    unix password sync = yes
# Permissions
    invalid users = root
    force group = shared
	guest ok = no
	map to guest = Bad User
# Miscellaneous
    case sensitive = no
    unix extensions = no
# Hidden Files
    hide dot files = yes
    hide special files = yes
    hide files = /._*/$*/.DS_Store/AUTORUN.INF/Desktop.ini/desktop.ini/Thumbs.db/thumbs.db/TheVolumeSettingsFolder/.AppleDouble/.TemporaryItems/.Spotlight-V100/TheFindByContentFolder/.FBCindex/.FBCIndexCopy/.localized/Network Trash Folder/Cleanup At Startup/

# Shares #

[Scratch]
    force user = media
    path = /mnt/smb/Scratch
    valid users = media ben
    write list = media ben
    create mask = 664
    directory mask = 775

[Media]
    force user = media
    read only = yes
    path = /mnt/smb/Media
    valid users = media ben
    directory mask = 775

[Data]
    force user = media
    read only = yes
    path = /mnt/smb/Data
    valid users = media ben
    directory mask = 775