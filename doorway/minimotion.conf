# /opt/rpi/minimotion.conf - global settings
# key = value (or Motion-style "key value"), one per line. Lines starting with
# # or ; are comments. Numbers accept k / M suffixes (2M = 2000000).
#
# Every setting below except "camera" and "log_level" is a default for all
# cameras; a camera's own file can override any of them. Without camera lines,
# this file alone describes a single camera.

# ---- Cameras -------------------------------------------------------------------
# One line per camera. Relative paths are relative to this file's folder.
camera = /opt/rpi/camera1.conf
# camera = /opt/rpi/camera2.conf

# 0 errors, 1 + warnings, 2 + events (default), 3 + per-frame debug.
log_level = 2

# ---- Copying finished movies -------------------------------------------------------
# Each finished movie is copied to every copy_to folder, keeping the day folder:
#   <copy_to>/YYYY-MM-DD/YYYY-MM-DD_HH.MM.SS.mp4
# Repeat the line for more destinations. A camera file that sets copy_to
# replaces this list instead of adding to it.
# Each copy_to folder must already exist; it is checked before every copy and
# never created. Use a folder inside the share (e.g. /mnt/nas1/cameras, not
# the mount point /mnt/nas1): if the share is not mounted, that folder is
# missing and the copy is refused rather than written to the SD card.
# copy_to = /mnt/nas1/cameras
# copy_to = /mnt/nas2/cameras

# A copy still unfinished after this many seconds counts as failed (hung share).
copy_timeout = 120

# If any destination cannot be written, the movie is also saved here and a
# warning names the destinations that failed. Comment out to disable.
# Like copy_to, the folder must already exist and is never created (only the
# day folders inside it), so a USB drive that is not mounted is reported and
# the movie stays in temp_dir instead of filling the empty mount point.
# Create it once on the drive:  sudo mkdir -p /mnt/usb/minimotion/doorway
# fallback_dir = /mnt/usb/minimotion

# ---- Recording defaults --------------------------------------------------------
# Movies are recorded into temp_dir, in one sub-folder per day:
#   <temp_dir>/YYYY-MM-DD/YYYY-MM-DD_HH.MM.SS.mp4 (local time of the event start)
# and deleted from it once they are safely stored elsewhere (every copy_to
# destination succeeded, or the fallback copy did). A movie with no safe copy
# stays here. Give every camera its own temp_dir (set it in the camera file).
# It lives on the RAM disk mounted by rpi-ramdisk.service and is created
# automatically.
temp_dir = /mnt/ramdisk/minimotion

# copy   = store the camera's H.264 as-is. Almost zero CPU, no quality loss.
# encode = re-encode on the Pi's hardware H.264 encoder at movie_bps.
record_mode = copy
movie_bps = 2M
# Keyframe interval for record_mode = encode, in frames. 0 = every 2 seconds.
movie_gop = 0
# Fragmented MP4 stays playable if power is lost mid-recording.
mp4_fragmented = on

# Shell command run in the background after each movie is saved and copied.
# %f = path of the movie: its first stored copy, or the file in temp_dir if
# no copy could be made.
# on_movie_end = /opt/rpi/upload.sh %f

# ---- Source defaults -----------------------------------------------------------
rtsp_transport = tcp
io_timeout = 10

# ---- Motion detection defaults -----------------------------------------------------
# Percentage of the picture that must change. Run "minimotion -v" to see the
# live value and tune this per camera.
threshold_percent = 1.0
# How much a pixel must change (0-255) to count. Raise if night/IR noise triggers.
noise_level = 16
# A change this large (in %) is a light change (lamps, IR day/night switch) and
# is re-learned instead of recorded. 0 = disabled.
lightswitch_percent = 40
minimum_motion_frames = 2
# Long side, in pixels, of the small image motion is analysed on.
detect_size = 160
# Frames analysed per second (0 = every frame).
detect_fps = 5

# ---- Event defaults ------------------------------------------------------------
# Seconds of video kept from before motion started (rounded back to a keyframe).
pre_capture_time = 2
# Seconds without motion that end an event.
event_gap = 5
# Maximum length of one file in seconds (0 = unlimited); longer events continue
# in a new file at the next keyframe.
movie_max_time = 120

# ---- Decoding ------------------------------------------------------------------
hw_decode = on
decoder_threads = 2
fast_decode = off
