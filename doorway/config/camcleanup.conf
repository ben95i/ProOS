## /etc/camcleanup.conf - Doorway settings for camcleanup.sh
## Keeps the doorway's clips on Google Drive (the files server's GSync share,
## mounted by autofs) under GDRIVE_LIMIT_GB by deleting the oldest first.
## Only files inside GDRIVE_CAMERA_FOLDER are ever deleted.
## One KEY=value per line, no quotes. Every setting is listed in
## /opt/rpi/camcleanup.sh.
## by Ben Provenzano III

## No flash drive: FLASH_PATH is not set, so none is cleaned

## Google Drive over SMB. The mount belongs to rclone on pve, so there is
## nothing here to restart.
GDRIVE_PATH=/mnt/smb/GSync
GDRIVE_CAMERA_FOLDER=/mnt/smb/GSync/Cameras/Doorway
GDRIVE_LIMIT_GB=14.5
RCLONE_SERVICE_NAME=

## GB left free below the limit (and on Drive) after a cleanup
FREE_SPACE_RESERVE_GB=2.5

## Files modified within this many minutes are never deleted
MIN_FILE_AGE_MINUTES=10

## Seconds to wait for a mount check before treating the mount as hung
MOUNT_CHECK_TIMEOUT_SECONDS=60

## Seconds allowed for scanning the folder / reading free space
COMMAND_TIMEOUT_SECONDS=450

## Cleanup log
FALLBACK_LOG_FILE=/tmp/camcleanup.log
FALLBACK_LOG_MAX_SIZE=128KB
