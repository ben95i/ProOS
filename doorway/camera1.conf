# /opt/rpi/camera1.conf - settings for one camera.
# Anything not set here comes from /opt/rpi/minimotion.conf.

# Name used in log lines (default: this file's name, "camera1").
camera_name = Doorway

rtsp_url = rtsp://127.0.0.1:8554/cam
temp_dir = /mnt/ramdisk/cameras/doorway

# This camera's destinations (replaces the copy_to list from minimotion.conf):
# the files server's Cameras share and its GSync (Google Drive) share, both
# mounted by autofs under /mnt/smb. Each folder must already exist.
copy_to = /mnt/smb/Cameras/Doorway
copy_to = /mnt/smb/GSync/Cameras/Doorway
# Fallback: a movie that neither share took is kept on the SD card's fallback
# partition instead (made by fallbackpart.sh, mounted by boot.sh, kept under
# its limit by camcleanup.sh); a share that failed is logged either way. The
# folder exists only while the partition is mounted; without it, or when the
# partition is full, the movie stays on the RAM disk until temp_max_age.
fallback_dir = /mnt/fallback/minimotion

# Clockwise display rotation for this camera (0, 90, 180, 270).
# For a camera mounted in portrait, use 90 or 270 (try one; if the picture is
# upside down, use the other).
rotation = 90

# Per-camera tuning.
threshold_percent = 4.0
noise_level = 16
